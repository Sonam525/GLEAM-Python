[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gleam-py"
version = "0.8.0"
description = "Python port of FAO's Global Livestock Environmental Assessment Model (GLEAM-X)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "GLEAM Python port contributors" }]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
"Original R package" = "https://github.com/un-fao/GLEAM"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gleam = ["data/*.csv", "data/run_gleam_examples/*.csv", "data/run_modules_examples/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"
filterwarnings = ["error::FutureWarning"]
