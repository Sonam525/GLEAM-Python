name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }}, latest dependencies)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test (unit tests + parity with R golden outputs)
        run: python -m pytest -q

  pyarrow:
    # pandas 3 stores text columns as pyarrow-backed strings whenever pyarrow
    # is installed, as it often is; the other jobs run without pyarrow.
    name: pytest (ubuntu-latest, Python 3.12, latest dependencies + pyarrow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]" pyarrow
      - name: Test
        run: python -m pytest -q -rs

  minimum-versions:
    # Exactly the floors declared in pyproject.toml, so they stay true. Also
    # on Windows: with numpy 1.x the default integer there is int32, not int64.
    name: pytest (${{ matrix.os }}, Python 3.10, minimum versions)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the declared minimum versions
        run: |
          python -m pip install "numpy==1.26.0" "pandas==2.2.0" "pytest==7.0.0"
          python -m pip install --no-deps -e .
      - name: Show versions
        run: python -c "import sys, numpy, pandas, pytest; print(sys.version); print('numpy', numpy.__version__, 'pandas', pandas.__version__, 'pytest', pytest.__version__)"
      - name: Test
        run: python -m pytest -q

  package:
    # Builds the sdist and the wheel, then runs the test suite shipped in the
    # sdist against the installed wheel (not against src/).
    name: build and test the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build --outdir dist
      - name: Install the wheel
        run: python -m pip install dist/*.whl pytest
      - name: Test the unpacked sdist against the installed wheel
        run: |
          mkdir sdist
          tar -xzf dist/*.tar.gz -C sdist --strip-components=1
          cd sdist
          python -m pytest -q -p no:cacheprovider -o pythonpath=tests

  r-reference:
    # Rebuilds the R reference from un-fao/GLEAM plus the shipped patch; the
    # script fails if the result differs from the tree the goldens came from.
    name: rebuild the R reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/r_reference/build_r_reference.sh "$RUNNER_TEMP/GLEAM-reference"

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check src tools tests --select E9,F
